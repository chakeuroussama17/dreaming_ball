name: Deploy Web

# Builds the Flutter web app and publishes it to GitHub Pages on every push to
# main. After the first successful run, enable Pages once:
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The live site will be at:
#   https://<your-username>.github.io/dreaming_ball/

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # .env is gitignored (Supabase key); recreate it from repo secrets.
      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      # Enables GitHub Pages automatically on first run (no manual toggle).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # base-href must match the repo name for a GitHub Pages project site.
      - name: Build web
        run: flutter build web --release --base-href /dreaming_ball/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
